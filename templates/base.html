<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CPK-PCBA{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <style>
        /* navbar-brand 绝对定位到左侧 */
        nav.navbar > div.container > a.navbar-brand {
            position: absolute;
            left: 10px;
        }
        /* navbarNav 静态定位 */
        div#navbarNav {
            position: static;
        }
        /* 侧栏内按钮的外边距调整 */
        main.container > div.d-flex > aside.flex-shrink-0 > div.card > .btn {
            margin: 0.5rem;
            width: calc(100% - 1rem);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-graph-up-arrow"></i> CPK-PCBA
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-house"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if not has_data|default(false) %} disabled{% endif %}" id="navStatsBtn" href="{{ url_for('stats_page') }}"{% if not has_data|default(false) %} aria-disabled="true"{% endif %} title="{% if has_data|default(false) %}查看数据统计{% else %}请先上传并解析 Excel 数据{% endif %}">
                            <i class="bi bi-bar-chart-steps"></i> 数据统计
                        </a>
                    </li>
                </ul>
            </div>
            <span class="navbar-text d-none d-md-inline" id="navProgramName"></span>
            <span class="navbar-text text-white-50 d-none d-md-inline">
                Excel 测试记录导入 · 曲线生成 · 统计分析
            </span>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3 border-top">
        <small>CPK-PCBA &copy; 2026 · Flask + Bootstrap + ECharts + Pandas</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 应用根路径 (含前缀, 如 /cpk), 供 main.js 拼接资源/API 地址
        window.BASE_URL = {{ url_for('index') | tojson }};
        if (window.BASE_URL.endsWith('/')) { window.BASE_URL = window.BASE_URL.slice(0, -1); }
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=7"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
